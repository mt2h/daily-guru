<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Pausa consciente">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3d3ff"/>
      <stop offset="0.55" stop-color="#b57bff"/>
      <stop offset="1" stop-color="#7a3df0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#a259ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a259ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="80" cy="70" r="72" fill="url(#halo)"/>
  <!-- aura rings -->
  <circle cx="80" cy="62" r="40" fill="none" stroke="#c4a7ff" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="80" cy="62" r="52" fill="none" stroke="#c4a7ff" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- head -->
  <circle cx="80" cy="42" r="12" fill="url(#g)"/>
  <!-- torso and arms -->
  <path d="M80 56c-14 0-22 8-24 22l-6 20c10 6 20 8 30 8s20-2 30-8l-6-20c-2-14-10-22-24-22z" fill="url(#g)"/>
  <!-- hands resting -->
  <ellipse cx="80" cy="97" rx="12" ry="5" fill="#150a26" fill-opacity="0.35"/>
  <!-- crossed legs -->
  <path d="M38 108c14 8 28 12 42 12s28-4 42-12c-4-8-12-12-20-12H58c-8 0-16 4-20 12z" fill="url(#g)" opacity="0.92"/>
  <!-- lotus petals under -->
  <g fill="url(#g)" opacity="0.9">
    <path d="M80 144c-10-6-14-14-12-22 6 0 10 4 12 10 2-6 6-10 12-10 2 8-2 16-12 22z"/>
    <path d="M52 138c-8-4-14-10-14-18 6-1 11 1 15 6z" opacity="0.8"/>
    <path d="M108 138c8-4 14-10 14-18-6-1-11 1-15 6z" opacity="0.8"/>
  </g>
</svg>
