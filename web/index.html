<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#120f1d">
  <meta name="description" content="Tu guru diario: enseñanza de budismo e hinduismo y un consejo para tu día">
  <title>Daily Guru</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="ambient ambient-three" aria-hidden="true"></div>
  <div class="ambient ambient-four" aria-hidden="true"></div>
  <div class="ambient ambient-five" aria-hidden="true"></div>

  <div class="energy-field" aria-hidden="true">
    <span class="energy-stream energy-stream-one"></span>
    <span class="energy-stream energy-stream-two"></span>
    <span class="energy-stream energy-stream-three"></span>
    <div class="particles">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <header class="site-header">
    <a class="brand" href="/" aria-label="Daily Guru">
      <img class="brand-logo" src="/logo.png" alt="Daily Guru" width="150" height="150">
      <span>
        <em class="brand-tag">Budismo e Hinduismo</em>
        <strong>Daily Guru</strong>
        <small>Enseñanza y calma para tu día</small>
      </span>
    </a>
    <div class="header-tools">
      <label class="voice-picker" title="Elige la voz del guru">
        <span class="sr-only">Voz del guru</span>
        <select id="voice-select" aria-label="Voz del guru">
          <option value="">Voz automática</option>
        </select>
      </label>
      <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false" aria-label="Activar cuencos tibetanos" title="Cuencos tibetanos">
        <span class="sound-icon" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </span>
        <span class="sound-label">Cuencos</span>
      </button>
      <div id="connection-status" class="status-pill" role="status">
        <span class="status-dot"></span>
        <span>Local</span>
      </div>
    </div>
  </header>

  <main id="app" class="app-shell" tabindex="-1">
    <section class="loading-card" aria-label="Cargando">
      <span class="spinner"></span>
      <p>El guru está preparando tu enseñanza del día…</p>
    </section>
  </main>

  <div id="message" class="toast" role="alert" aria-live="assertive" hidden></div>
  <div id="live-region" class="sr-only" aria-live="polite"></div>

  <footer class="site-footer">
    <span>Un momento de calma al día</span>
    <span>Kiro se conecta solo al abrir la app</span>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
